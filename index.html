<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
      <div class="screen">
        <div class="text">1000</div>
      </div>
      <div class="functions">
          <button id="clear" class="calcButton">AC</button>
        </div>
      <div class="inputContainer">
        <div class="numbers">
          <div class="firstCol">
            <button id="7" class="number calcButton">7</button>
            <button id="8" class="number calcButton">8</button>
            <button id="9" class="number calcButton">9</button>
          </div>
          <div class="secondCol">
            <button id="4" class="number calcButton">4</button>
            <button id="5" class="number calcButton">5</button>
            <button id="6" class="number calcButton">6</button>
          </div>
          <div class="thirdCol">
            <button id="1" class="number calcButton">1</button>
            <button id="2" class="number calcButton">2</button>
            <button id="3" class="number calcButton">3</button>
          </div>
          <div class="fourthCol">
            <button id="2" class="number calcButton">0</button>
            <button id="dot" class="calcButton">.</button>
          </div>
        </div>
        <div class="operators">
          <button id="-" class="calcButton">-</button>
          <button id="+" class="calcButton">+</button>
          <button id="=" class="calcButton">=</button>
      </div>
      </div>
    </div>
  </div>
</body>
</html>
