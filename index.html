<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="manifest" href="site.webmanifest">
  <script src="script.js" defer></script>
</head>
<body>
    <div class="whitespace"></div>
    <div class="container">
      <div class="screen">
        <div class="pastOperationDisplay"></div>
        <div class="display"></div>
      </div>
      <div class="inputContainer">
        <div class="functions">
          <button id="clear" class="calcButton">AC</button>
          <button id="backspace" class="calcButton">DEL</button>
        </div>
        <div class="numbers">
          <div class="firstRow">
            <button id="7" class="number calcButton">7</button>
            <button id="8" class="number calcButton">8</button>
            <button id="9" class="number calcButton">9</button>
            <button id="minus" class="operator calcButton">-</button>
          </div>
          <div class="secondRow">
            <button id="4" class="number calcButton">4</button>
            <button id="5" class="number calcButton">5</button>
            <button id="6" class="number calcButton">6</button>
            <button id="+" class="operator calcButton">+</button>
          </div>
          <div class="thirdRow">
            <button id="1" class="number calcButton">1</button>
            <button id="2" class="number calcButton">2</button>
            <button id="3" class="number calcButton">3</button>
            <button id="*" class="operator calcButton">*</button>
          </div>
          <div class="fourthRow">
            <button id="2" class="number calcButton">0</button>
            <button id="dot" class="number calcButton">.</button>
            <button id="equal" class="calcButton">=</button>
            <button id="/" class="operator calcButton">/</button>
          </div>
        </div>
      </div>
    </div>
    <div class="whitespace footer">
      <div class="footerText">Copyright &copy nicolondonoe 2026</div>
      <a href="https://github.com/nicolondonoe" target="_blank">
        <img class="github-logo" src="github-mark.svg">
      </a>
    </div>
  </div>
</body>
</html>
